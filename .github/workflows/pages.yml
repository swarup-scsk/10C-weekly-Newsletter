name: Publish to GitHub Pages

# Builds issues/*.md into a site and deploys it to GitHub Pages for THIS repo.
# Runs after the newsletter workflow finishes (workflow_run avoids the GITHUB_TOKEN
# "no chained workflows" restriction), on manual edits, or on manual dispatch.

on:
  workflow_run:
    workflows: ["10C AI Weekly"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "issues/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    # Skip if the triggering newsletter run failed (nothing new to publish).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the site
        run: |
          pip install markdown requests
          python site/build_site.py issues _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify Teams channel
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SITE_BASE_URL: "https://swarup-scsk.github.io/10C-weekly-Newsletter"
        run: python site/notify_teams.py
